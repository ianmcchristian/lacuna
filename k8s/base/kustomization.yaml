# Base manifests. Expects a lacuna-db Secret with a database-url key.
# For a local kind cluster with its own Postgres, apply k8s/local instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: lacuna
resources:
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
configMapGenerator:
  - name: lacuna-config
    literals:
      - LACUNA_LOG_JSON=true
      - LACUNA_MIN_GAP_RATIO=0.8
      - LACUNA_INFERENCE_THREADS=1 # matches the 1 CPU limit
