# One-shot schema migration. Run before rolling out a new image.
apiVersion: batch/v1
kind: Job
metadata:
  name: lacuna-migrate
spec:
  backoffLimit: 6 # retries with backoff while the database comes up
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: lacuna:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: LACUNA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lacuna-db
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
