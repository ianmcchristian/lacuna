apiVersion: apps/v1
kind: Deployment
metadata:
  name: lacuna
  labels:
    app: lacuna
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lacuna
  template:
    metadata:
      labels:
        app: lacuna
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: lacuna:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: lacuna-config
          env:
            - name: LACUNA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lacuna-db
                  key: database-url
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # model load takes a few seconds; don't restart while it does
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
