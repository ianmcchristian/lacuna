# Local kind cluster with its own Postgres:
#   kind create cluster --name lacuna --config k8s/local/kind.yaml
#   docker build -t lacuna:local . && kind load docker-image lacuna:local --name lacuna
#   kubectl apply -k k8s/local/
#   kubectl port-forward svc/lacuna 8080:80
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - postgres.yaml
secretGenerator:
  # local throwaway credentials, same as docker-compose
  - name: lacuna-db
    literals:
      - database-url=postgresql+psycopg://lacuna:lacuna@postgres:5432/lacuna
