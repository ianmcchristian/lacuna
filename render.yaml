# Render blueprint for the public API. Free plan: 512 MB RAM, sleeps after 15 min idle.
# CI deploys through a deploy hook once every check and the Neon migration pass,
# then waits for /health to report the new commit. Render's own auto-deploy is off.
services:
  - type: web
    name: lacuna
    runtime: docker
    plan: free
    region: virginia # same AWS region as the Neon database
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: LACUNA_DATABASE_URL
        sync: false # Neon connection string, entered once in the Render dashboard
      - key: LACUNA_INFERENCE_THREADS
        value: "1" # free plan has 0.1 CPU; more threads just fight over it
      - key: LACUNA_CORS_ORIGINS
        value: '["https://ianmcchristian.github.io", "http://localhost:5173"]'
