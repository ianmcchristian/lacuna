name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lacuna
          POSTGRES_PASSWORD: lacuna
          POSTGRES_DB: lacuna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LACUNA_TEST_DATABASE_URL: postgresql+psycopg://lacuna:lacuna@localhost:5432/lacuna_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: weights-sku110k-yolo11-s640-v1

      - run: uv run python scripts/download_weights.py s

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy lacuna tests scripts

      - name: Test (Postgres)
        run: uv run pytest --cov --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test (includes axe accessibility checks)
        run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lacuna:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          docker image inspect lacuna:ci --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1e6}'

      - name: Smoke test the container
        run: |
          docker run -d --name lacuna -p 8080:8080 \
            -e LACUNA_DATABASE_URL=sqlite:////tmp/lacuna.db lacuna:ci \
            sh -c 'alembic upgrade head && exec uvicorn lacuna.main:create_app --factory --host 0.0.0.0 --port 8080'
          for i in $(seq 30); do curl -sf localhost:8080/ready && break; sleep 2; done
          curl -sfL -o shelf.jpg \
            https://huggingface.co/chistopat/sku110k-yolo11-object-detector/resolve/ee1b8ac34eb3b68969ffa8165e50c43457fe4e35/examples/drink-shelf-yolo11s-object.jpg
          image_id=$(curl -sf -F 'file=@shelf.jpg;type=image/jpeg' localhost:8080/images | jq -r .id)
          curl -sf -X POST localhost:8080/detect -H 'content-type: application/json' \
            -d "{\"image_id\": \"$image_id\"}" | tee scan.json
          jq -e '.product_count > 0' scan.json
          docker logs lacuna | tail -5

  deploy:
    needs: [test, web, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: huggingface
      url: https://ianmcchristian-lacuna.hf.space/docs
    env:
      LACUNA_DATABASE_URL: ${{ secrets.LACUNA_DATABASE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrate Neon
        run: uv run alembic upgrade head
      - name: Deploy to Hugging Face Space
        run: uv run python scripts/deploy_space.py
