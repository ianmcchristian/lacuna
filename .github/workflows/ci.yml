name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lacuna
          POSTGRES_PASSWORD: lacuna
          POSTGRES_DB: lacuna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LACUNA_TEST_DATABASE_URL: postgresql+psycopg://lacuna:lacuna@localhost:5432/lacuna_test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/int8-model
      - run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy lacuna tests scripts

      - name: Test (Postgres)
        run: uv run pytest --cov --cov-report=term-missing

      # x86 numbers, closer to Render than a laptop. Shows up in the run summary.
      - name: Benchmark fp32 vs INT8
        run: uv run python scripts/benchmark.py --runs 2 | tee -a "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/int8-model # the UI runs it in the browser
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (axe in jsdom)
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (axe WCAG 2.2 AA, keyboard flow, browser vs Python gap parity)
        run: npm run e2e

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lacuna:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          docker image inspect lacuna:ci --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1e6}'

      - name: Smoke test the container
        run: |
          docker run -d --name lacuna -p 8080:8080 \
            -e LACUNA_DATABASE_URL=sqlite:////tmp/lacuna.db lacuna:ci \
            sh -c 'alembic upgrade head && exec uvicorn lacuna.main:create_app --factory --host 0.0.0.0 --port 8080'
          for i in $(seq 30); do curl -sf localhost:8080/ready && break; sleep 2; done
          image_id=$(curl -sf -F 'file=@docs/demo/bottles.jpg;type=image/jpeg' localhost:8080/images | jq -r .id)
          curl -sf -X POST localhost:8080/detect -H 'content-type: application/json' \
            -d "{\"image_id\": \"$image_id\"}" | tee scan.json
          # the image ships the INT8 model, and it should find both holes in the demo shelf
          jq -e '.model == "sku110k-yolo11-s640-int8" and .gap_count == 2' scan.json
          docker logs lacuna | tail -5

  # Render deploys main once these checks pass, so the schema is always ready first
  migrate:
    needs: [test, web, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: migrate
      cancel-in-progress: false
    env:
      LACUNA_DATABASE_URL: ${{ secrets.LACUNA_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Migrate Neon
        run: uv run --no-dev alembic upgrade head

  # Deploys through a Render deploy hook, then waits until prod says it's running
  # this commit. A deploy that never lands fails here instead of going unnoticed.
  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: true # a newer push deploys a newer commit anyway
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API: https://lacuna-mp1n.onrender.com
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_URL not set, skipping deploy"; exit 0; fi
          curl -sf -X POST "$HOOK" > /dev/null
      - name: Wait for prod to run this commit
        if: env.HOOK != ''
        timeout-minutes: 20
        run: |
          until [ "$(curl -s --max-time 60 "$API/health" | jq -r .commit)" = "$GITHUB_SHA" ]; do sleep 20; done
          curl -s "$API/health"
