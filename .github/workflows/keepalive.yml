# Free Spaces sleep after 48h with no traffic. One request a day keeps the demo awake.
name: keepalive

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        # a sleeping Space can take a minute or two to wake
        run: curl -sf --retry 10 --retry-delay 15 --retry-all-errors --max-time 30 https://ianmcchristian-lacuna.hf.space/health
