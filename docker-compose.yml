# Local stack: Postgres, a one-shot migration, then the API on :8080.
# The db password here is a throwaway for local dev only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lacuna
      POSTGRES_PASSWORD: lacuna
      POSTGRES_DB: lacuna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacuna"]
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    image: lacuna:local
    command: alembic upgrade head
    environment:
      LACUNA_DATABASE_URL: postgresql+psycopg://lacuna:lacuna@db:5432/lacuna
    depends_on:
      db:
        condition: service_healthy

  api:
    image: lacuna:local
    ports: ["8080:8080"]
    environment:
      LACUNA_DATABASE_URL: postgresql+psycopg://lacuna:lacuna@db:5432/lacuna
      LACUNA_CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
