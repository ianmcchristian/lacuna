[project]
name = "lacuna"
version = "0.1.0"
description = "Retail shelf out-of-stock detection service."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Ian McChristian" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lacuna"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "huggingface-hub>=2.1.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "cv2.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["model: needs the real ONNX weights in models/"]
# upstream: starlette wants httpx2 for TestClient, nothing to fix on our side yet
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["lacuna"]
